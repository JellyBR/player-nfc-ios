<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    
    <!-- Blindagem de Viewport para iOS: Previne Zoom, Gestos e Escala Extrema -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    
    <!-- Meta-tags PWA Apple (Tela Cheia Real via Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SNES Card">
    
    <title>Sistema de Execução - Cartucho NFC</title>
    
    <style>
        :root {
            /* Uso de Unidades Dinâmicas Reais da Apple (dvh) */
            --canvas-height: 45dvh;
            --gamepad-height: calc(100dvh - var(--canvas-height));
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100dvh; 
            background-color: #050505; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
            
            /* BLOQUEIO TOTAL DE GESTOS DO SAFARI (Seleção, Zoom, Callout) */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
        }
        
        /* --- TELA DE POWER ON (Sua Identidade Visual Preservada) --- */
        #power-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; 
        }
        .cart-status { 
            color: #00ff00; font-size: 1.2rem; margin-bottom: 40px; 
            text-shadow: 0 0 10px #00ff00; text-transform: uppercase; 
        }
        #power-btn { 
            background-color: transparent; border: 3px solid #ff0000; color: #ff0000; 
            padding: 15px 40px; font-size: 1.8rem; font-weight: bold; font-family: inherit; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; 
            transition: all 0.1s ease-in-out; 
        }
        #power-btn:active { background-color: #ff0000; color: #000; transform: scale(0.95); }
        
        #loading-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .loader-text { color: #fff; font-size: 1.3rem; font-weight: bold; letter-spacing: 3px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; text-shadow: 0 0 15px #fff; } 100% { opacity: 0.2; } }

        /* --- CONTAINER DE EXECUÇÃO DO JOGO (4:3 Limpo no Topo) --- */
        #game-container { 
            width: 100%; height: var(--canvas-height); 
            display: none; justify-content: center; align-items: center; 
            background: #000; position: relative; z-index: 10;
        }
        #game-canvas {
            max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3;
            image-rendering: pixelated; /* Pixels nítidos no Retina Display do iPhone */
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* --- GAMEPAD UNIVERSAL ADAPTATIVO (Metade Inferior) --- */
        #gamepad {
            width: 100%; height: var(--gamepad-height);
            background: #151515; border-top: 2px solid #222;
            display: none; grid-template-columns: 1fr 1fr;
            padding: 15px; position: relative; z-index: 10;
        }
        .pad-zone { display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* Estilização Básica dos Botões de Toque */
        .dpad { width: 140px; height: 140px; position: relative; background: #222; border-radius: 50%; }
        .dpad-btn { position: absolute; width: 45px; height: 45px; background: #333; border-radius: 8px; }
        .dpad-up { top: 5px; left: 47.5px; } .dpad-down { bottom: 5px; left: 47.5px; }
        .dpad-left { top: 47.5px; left: 5px; } .dpad-right { top: 47.5px; right: 5px; }
        
        .action-cluster { width: 150px; height: 150px; position: relative; }
        .btn-face { position: absolute; width: 50px; height: 50px; border-radius: 50%; border: none; font-weight: bold; font-size: 1.2rem; color: #fff; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px #111; }
        .btn-a { right: 0; top: 50px; background: #d32f2f; }
        .btn-b { bottom: 0; left: 50px; background: #fbc02d; color: #000; }
        .btn-x { top: 0; left: 50px; background: #1976d2; }
        .btn-y { left: 0; top: 50px; background: #388e3c; }

        /* Botão de Emergência / Cartilha: Exportar Save */
        #save-tools {
            position: absolute; top: 5px; right: 10px; z-index: 100;
        }
        .btn-save { background: #333; color: #aaa; border: 1px solid #555; padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; }
    </style>
</head>
<body>
    
    <!-- Tela Inicial de Power On -->
    <div id="power-screen">
        <div class="cart-status">Conexão Estabelecida</div>
        <button id="power-btn">POWER ON</button>
    </div>

    <!-- Overlay de Carregamento -->
    <div id="loading-overlay">
        <div class="loader-text">INJETANDO MOTOR SNES...</div>
    </div>

    <!-- Área da Tela do Jogo (Canvas NATIVO, Sem Wrapper RetroArch) -->
    <div id="game-container">
        <div id="save-tools"><button class="btn-save" id="btn-export-save">💾 Exportar Save (.sav)</button></div>
        <canvas id="game-canvas" width="512" height="448"></canvas>
    </div>

    <!-- Gamepad Virtual Universal -->
    <div id="gamepad">
        <div class="pad-zone">
            <div class="dpad">
                <div class="dpad-btn dpad-up" data-key="UP"></div>
                <div class="dpad-btn dpad-down" data-key="DOWN"></div>
                <div class="dpad-btn dpad-left" data-key="LEFT"></div>
                <div class="dpad-btn dpad-right" data-key="RIGHT"></div>
            </div>
        </div>
        <div class="pad-zone">
            <div class="action-cluster">
                <div class="btn-face btn-x" data-key="X">X</div>
                <div class="btn-face btn-y" data-key="Y">Y</div>
                <div class="btn-face btn-a" data-key="A">A</div>
                <div class="btn-face btn-b" data-key="B">B</div>
            </div>
        </div>
    </div>

    <!-- Inclusão do nosso Motor Leve Isolado (A ser criado no próximo passo) -->
    <script src="snes-core.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sys = urlParams.get('c');
        const dataId = urlParams.get('id');

        const powerBtn = document.getElementById('power-btn');
        const powerScreen = document.getElementById('power-screen');
        const loadingOverlay = document.getElementById('loading-overlay');
        const gameContainer = document.getElementById('game-container');
        const gamepad = document.getElementById('gamepad');

        if (sys === 'snes' && dataId) {
            powerBtn.addEventListener('click', async function() {
                
                // 1. Esconde Power e mostra Loading
                powerScreen.style.display = 'none';
                loadingOverlay.style.display = 'flex';

                try {
                    // 2. INICIALIZAÇÃO DE ÁUDIO NO GESTO DE TOQUE (Destrava a segurança do iOS)
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

                    // 3. CAMINHO DOS ARQUIVOS VIA GITHUB / CLOUDFLARE
                    // IMPORTANTE: Não chamamos mais CDN externa do EmulatorJS!
                    const romUrl = `roms/${sys}/${dataId}`;
                    const coreUrl = `snes9x.wasm`;

                    // 4. CHAMA O MOTOR LEVE (Função definida no snes-core.js)
                    await window.SnesPlayer.init({
                        canvas: document.getElementById('game-canvas'),
                        audioContext: audioCtx,
                        corePath: coreUrl,
                        romPath: romUrl,
                        cartId: dataId
                    });

                    // 5. Exibe a tela e os controles nativos, escondendo o loading
                    loadingOverlay.style.display = 'none';
                    gameContainer.style.display = 'flex';
                    gamepad.style.display = 'grid';

                    // 6. SCROLL HACK PARA IOS (Esconde a barra do Safari empurrando a página para cima)
                    setTimeout(() => { window.scrollTo(0, 1); }, 100);

                } catch (error) {
                    console.error("Erro fatal ao carregar cartucho:", error);
                    alert("Falha ao decodificar a ROM no iPhone. Verifique a conexão com o chip NFC.");
                    loadingOverlay.style.display = 'none';
                    powerScreen.style.display = 'flex';
                }
            }, { once: true });
        } else {
            document.querySelector('.cart-status').innerText = "Cartucho Inválido";
            document.querySelector('.cart-status').style.color = "#ff0000";
            powerBtn.style.display = "none";
        }
    </script>
</body>
</html>
