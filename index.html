<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SNES Card">
    
    <title>Sistema de Execução - Cartucho NFC</title>
    
    <style>
        :root {
            --canvas-height: 45dvh;
            --gamepad-height: calc(100dvh - var(--canvas-height));
        }

        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background-color: #050505; overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
            touch-action: none; 
        }
        
        #power-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; 
        }
        .cart-status { color: #00ff00; font-size: 1.2rem; margin-bottom: 40px; text-shadow: 0 0 10px #00ff00; text-transform: uppercase; }
        #power-btn { 
            background-color: transparent; border: 3px solid #ff0000; color: #ff0000; 
            padding: 15px 40px; font-size: 1.8rem; font-weight: bold; font-family: inherit; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.1s ease-in-out; 
        }
        #power-btn:active { background-color: #ff0000; color: #000; transform: scale(0.95); }
        
        #loading-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .loader-text { color: #fff; font-size: 1.3rem; font-weight: bold; letter-spacing: 3px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; text-shadow: 0 0 15px #fff; } 100% { opacity: 0.2; } }

        #game-container { 
            width: 100%; height: var(--canvas-height); 
            display: none; justify-content: center; align-items: center; 
            background: #000; position: relative; z-index: 10;
        }
        #game-canvas {
            display: block; width: 100%; height: 100%;
            max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3;
            image-rendering: pixelated; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* === GAMEPAD ERGÔNOMICO COMPLETO (SNES / GBA) === */
        #gamepad {
            width: 100%; height: var(--gamepad-height);
            background: #151515; border-top: 2px solid #222;
            display: none; flex-direction: column;
            padding: 10px 15px; position: relative; z-index: 10;
        }
        
        /* Barra Superior: Botões de Ombro (L e R) */
        .shoulder-bar {
            width: 100%; display: flex; justify-content: space-between;
            margin-bottom: 10px;
        }
        .btn-shoulder {
            width: 90px; height: 35px; background: #333; border: 2px solid #444;
            border-radius: 8px; color: #fff; font-weight: bold; font-size: 1rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px #111;
        }

        /* Área Principal do Controle (D-Pad, Center, A/B/X/Y) */
        .main-controls {
            width: 100%; flex: 1; display: flex;
            justify-content: space-between; align-items: center;
        }
        
        /* Direcional (Esquerda) */
        .pad-zone { display: flex; justify-content: center; align-items: center; }
        .dpad { width: 130px; height: 130px; position: relative; background: #222; border-radius: 50%; }
        .dpad-btn { position: absolute; width: 42px; height: 42px; background: #333; border-radius: 6px; }
        .dpad-up { top: 4px; left: 44px; } .dpad-down { bottom: 4px; left: 44px; }
        .dpad-left { top: 44px; left: 4px; } .dpad-right { top: 44px; right: 4px; }
        
        /* Pílulas Centrais (Select e Start) */
        .center-cluster {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 15px;
        }
        .btn-pill {
            width: 65px; height: 22px; background: #333; border: 1px solid #555;
            border-radius: 12px; color: #ccc; font-size: 0.65rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            letter-spacing: 1px; box-shadow: 0 2px #111;
        }
        
        /* Ações de Rosto (Direita) */
        .action-cluster { width: 140px; height: 140px; position: relative; }
        .btn-face { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: none; font-weight: bold; font-size: 1.1rem; color: #fff; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px #111; }
        .btn-a { right: 0; top: 47px; background: #d32f2f; }
        .btn-b { bottom: 0; left: 47px; background: #fbc02d; color: #000; }
        .btn-x { top: 0; left: 47px; background: #1976d2; }
        .btn-y { left: 0; top: 47px; background: #388e3c; }

        #save-tools { position: absolute; top: 5px; right: 10px; z-index: 100; }
        .btn-save { background: #333; color: #aaa; border: 1px solid #555; padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="power-screen">
        <div class="cart-status">Conexão Estabelecida</div>
        <button id="power-btn">POWER ON</button>
    </div>

    <div id="loading-overlay">
        <div class="loader-text">INJETANDO MOTOR SNES...</div>
    </div>

    <div id="game-container">
        <div id="save-tools"><button class="btn-save" id="btn-export-save">💾 Exportar Save (.sav)</button></div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Novo Gamepad Completo de 12 Botões -->
    <div id="gamepad">
        <!-- Barra de Ombros -->
        <div class="shoulder-bar">
            <div class="btn-shoulder" data-key="L">L</div>
            <div class="btn-shoulder" data-key="R">R</div>
        </div>
        
        <!-- Controles Principais -->
        <div class="main-controls">
            <div class="pad-zone">
                <div class="dpad">
                    <div class="dpad-btn dpad-up" data-key="UP"></div>
                    <div class="dpad-btn dpad-down" data-key="DOWN"></div>
                    <div class="dpad-btn dpad-left" data-key="LEFT"></div>
                    <div class="dpad-btn dpad-right" data-key="RIGHT"></div>
                </div>
            </div>
            
            <div class="center-cluster">
                <div class="btn-pill" data-key="SELECT">SELECT</div>
                <div class="btn-pill" data-key="START">START</div>
            </div>

            <div class="pad-zone">
                <div class="action-cluster">
                    <div class="btn-face btn-x" data-key="X">X</div>
                    <div class="btn-face btn-y" data-key="Y">Y</div>
                    <div class="btn-face btn-a" data-key="A">A</div>
                    <div class="btn-face btn-b" data-key="B">B</div>
                </div>
            </div>
        </div>
    </div>

    <script src="snes-core.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sys = urlParams.get('c');
        const dataId = urlParams.get('id');

        const powerBtn = document.getElementById('power-btn');
        const powerScreen = document.getElementById('power-screen');
        const loadingOverlay = document.getElementById('loading-overlay');
        const gameContainer = document.getElementById('game-container');
        const gamepad = document.getElementById('gamepad');

        if (sys === 'snes' && dataId) {
            powerBtn.addEventListener('click', async function() {
                
                powerScreen.style.display = 'none';
                loadingOverlay.style.display = 'flex';

                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

                    const romUrl = `roms/${sys}/${dataId}`;
                    const coreUrl = `snes9x.wasm`;

                    gameContainer.style.display = 'flex';
                    gamepad.style.display = 'flex'; // Agora usa flexbox estruturado!

                    await window.SnesPlayer.init({
                        canvas: document.getElementById('game-canvas'),
                        audioContext: audioCtx,
                        corePath: coreUrl,
                        romPath: romUrl,
                        cartId: dataId
                    });

                    loadingOverlay.style.display = 'none';
                    setTimeout(() => { window.scrollTo(0, 1); }, 100);

                } catch (error) {
                    console.error("Erro fatal ao carregar cartucho:", error);
                    alert("Falha ao decodificar a ROM no navegador.");
                    loadingOverlay.style.display = 'none';
                    powerScreen.style.display = 'flex';
                }
            }, { once: true });
        } else {
            document.querySelector('.cart-status').innerText = "Cartucho Inválido";
            document.querySelector('.cart-status').style.color = "#ff0000";
            powerBtn.style.display = "none";
        }
    </script>
</body>
</html>
