<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SNES Card">
    
    <title>Sistema de Execução - Cartucho NFC</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background-color: #050505; overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
            touch-action: none; 
        }
        
        #power-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10000; 
        }
        .cart-status { color: #00ff00; font-size: 1.2rem; margin-bottom: 40px; text-shadow: 0 0 10px #00ff00; text-transform: uppercase; }
        #power-btn { 
            background-color: transparent; border: 3px solid #ff0000; color: #ff0000; 
            padding: 15px 40px; font-size: 1.8rem; font-weight: bold; font-family: inherit; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.1s ease-in-out; 
        }
        #power-btn:active { background-color: #ff0000; color: #000; transform: scale(0.95); }
        
        #loading-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .loader-text { color: #fff; font-size: 1.3rem; font-weight: bold; letter-spacing: 3px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; text-shadow: 0 0 15px #fff; } 100% { opacity: 0.2; } }

        .btn-save { background: #282828; color: #aaa; border: 1px solid #555; padding: 5px 10px; font-size: 0.7rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; }

        /* =====================================================================
           GEOMETRIA 1: MODO RETRATO / VERTICAL
           ===================================================================== */
        #app-wrapper {
            width: 100vw; height: 100dvh;
            display: none; flex-direction: column;
            justify-content: space-between; align-items: center;
            background: #000;
        }

        #game-container { 
            width: 100%; flex: 0 0 auto; display: flex; 
            justify-content: center; align-items: center; 
            background: #000; position: relative; z-index: 10;
            padding-top: 5px;
        }
        #game-canvas {
            display: block; width: 100vw; max-height: 44dvh; aspect-ratio: 4 / 3;
            object-fit: contain; image-rendering: pixelated; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); outline: none;
        }

        #gamepad {
            width: 100%; flex: 1; max-height: 420px;
            background: #151515; border-top: 2px solid #222;
            display: flex; flex-direction: column;
            padding: 8px 15px 15px 15px; position: relative; z-index: 10;
            box-sizing: border-box; justify-content: space-between;
        }
        
        .shoulder-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-shoulder {
            width: 85px; height: 34px; background: #282828; border: 2px solid #444;
            border-radius: 8px; color: #fff; font-weight: bold; font-size: 0.95rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 3px #111; cursor: pointer;
        }

        .main-controls { width: 100%; flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        
        .pad-zone { display: flex; justify-content: center; align-items: center; }
        .dpad { width: 130px; height: 130px; position: relative; background: #222; border-radius: 50%; }
        .dpad-btn { position: absolute; width: 42px; height: 42px; background: #333; border-radius: 8px; cursor: pointer; }
        .dpad-up { top: 4px; left: 44px; } .dpad-down { bottom: 4px; left: 44px; }
        .dpad-left { top: 44px; left: 4px; } .dpad-right { top: 44px; right: 4px; }
        
        .center-cluster { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
        .btn-pill {
            width: 65px; height: 24px; background: #282828; border: 1px solid #555;
            border-radius: 12px; color: #ccc; font-size: 0.68rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            letter-spacing: 1px; box-shadow: 0 2px #111; cursor: pointer;
        }
        
        .action-cluster { width: 140px; height: 140px; position: relative; }
        .btn-face { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: none; font-weight: bold; font-size: 1.1rem; color: #fff; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px #111; cursor: pointer; }
        .btn-a { right: 0; top: 47px; background: #d32f2f; }
        .btn-b { bottom: 0; left: 47px; background: #fbc02d; color: #000; }
        .btn-x { top: 0; left: 47px; background: #1976d2; }
        .btn-y { left: 0; top: 47px; background: #388e3c; }

        /* Regras padrão de visibilidade */
        .landscape-only { display: none !important; }
        .portrait-only { display: flex !important; }

        /* =====================================================================
           GEOMETRIA 2: MODO PAISAGEM / HORIZONTAL
           ===================================================================== */
        @media (orientation: landscape) {
            .portrait-only { display: none !important; }
            .landscape-only { display: flex !important; }

            #app-wrapper {
                position: relative; width: 100vw; height: 100dvh;
                display: block !important;
            }

            #game-container {
                position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
                padding: 0; z-index: 1; background: #000;
            }
            #game-canvas {
                width: auto; height: 100dvh; max-width: 100vw; max-height: 100dvh;
                box-shadow: none;
            }

            #gamepad {
                position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
                background: transparent; border: none; z-index: 10;
                padding: 10px 30px; max-height: none;
                pointer-events: none;
            }

            .dpad, .btn-face, .btn-shoulder, .landscape-pill, .btn-save {
                pointer-events: auto; opacity: 0.88;
            }

            .shoulder-bar {
                position: absolute; top: 12px; left: 30px; width: calc(100vw - 60px);
                margin: 0; pointer-events: none; justify-content: space-between; display: flex !important;
            }
            .btn-shoulder { pointer-events: auto; width: 90px; height: 35px; }

            .main-controls {
                width: 100%; height: 100%; align-items: flex-end;
                padding-bottom: 5px; pointer-events: none; display: flex !important;
            }

            /* HUD ESQUERDO: Select e Save acima do Direcional */
            .left-hud-group {
                position: absolute; bottom: 155px; left: 35px;
                display: flex !important; flex-direction: column; gap: 8px; align-items: center;
                pointer-events: auto; z-index: 20;
            }

            /* HUD DIREITO: Start acima dos botões A/B/X/Y */
            .right-hud-group {
                position: absolute; bottom: 165px; right: 35px;
                display: flex !important; flex-direction: column; gap: 8px; align-items: center;
                pointer-events: auto; z-index: 20;
            }
            
            .landscape-pill {
                width: 75px; height: 26px; background: #282828; border: 1px solid #555;
                border-radius: 12px; color: #ccc; font-size: 0.7rem; font-weight: bold;
                display: flex; justify-content: center; align-items: center;
                letter-spacing: 1px; box-shadow: 0 2px #111; cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <div id="power-screen">
        <div class="cart-status">Conexão Estabelecida</div>
        <button id="power-btn">POWER ON</button>
    </div>

    <div id="loading-overlay">
        <div class="loader-text">INJETANDO MOTOR SNES...</div>
    </div>

    <div id="app-wrapper">
        <div id="game-container">
            <canvas id="game-canvas" tabindex="-1"></canvas>
        </div>

        <div id="gamepad">
            <!-- Barra Superior (Vertical: L, Save, R) -->
            <div class="shoulder-bar">
                <div class="btn-shoulder" data-key="L">L</div>
                <div class="portrait-only" style="margin: 0;">
                    <button class="btn-save" id="btn-export-save">💾 Save (.sav)</button>
                </div>
                <div class="btn-shoulder" data-key="R">R</div>
            </div>
            
            <div class="main-controls">
                <div class="pad-zone">
                    <div class="dpad">
                        <div class="dpad-btn dpad-up" data-key="UP"></div>
                        <div class="dpad-btn dpad-down" data-key="DOWN"></div>
                        <div class="dpad-btn dpad-left" data-key="LEFT"></div>
                        <div class="dpad-btn dpad-right" data-key="RIGHT"></div>
                    </div>
                </div>
                
                <div class="center-cluster portrait-only">
                    <div class="btn-pill" data-key="SELECT">SELECT</div>
                    <div class="btn-pill" data-key="START">START</div>
                </div>

                <div class="pad-zone">
                    <div class="action-cluster">
                        <div class="btn-face btn-x" data-key="X">X</div>
                        <div class="btn-face btn-y" data-key="Y">Y</div>
                        <div class="btn-face btn-a" data-key="A">A</div>
                        <div class="btn-face btn-b" data-key="B">B</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HUDs Flutuantes Otimizados para a Horizontal -->
        <div class="landscape-only left-hud-group">
            <button class="btn-save" id="btn-export-save-landscape">💾 Save</button>
            <div class="landscape-pill" data-key="SELECT">SELECT</div>
        </div>

        <div class="landscape-only right-hud-group">
            <div class="landscape-pill" data-key="START">START</div>
        </div>
    </div>

    <script src="snes-core.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sys = urlParams.get('c');
        const dataId = urlParams.get('id');

        const powerBtn = document.getElementById('power-btn');
        const powerScreen = document.getElementById('power-screen');
        const loadingOverlay = document.getElementById('loading-overlay');
        const appWrapper = document.getElementById('app-wrapper');

        if (sys === 'snes' && dataId) {
            powerBtn.addEventListener('click', async function() {
                
                powerScreen.style.display = 'none';
                loadingOverlay.style.display = 'flex';

                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

                    const romUrl = `roms/${sys}/${dataId}`;
                    const coreUrl = `snes9x.wasm`;

                    appWrapper.style.display = 'flex';

                    await window.SnesPlayer.init({
                        canvas: document.getElementById('game-canvas'),
                        audioContext: audioCtx,
                        corePath: coreUrl,
                        romPath: romUrl,
                        cartId: dataId
                    });

                    loadingOverlay.style.display = 'none';
                    setTimeout(() => { window.scrollTo(0, 1); }, 100);

                } catch (error) {
                    console.error("Erro fatal ao carregar cartucho:", error);
                    alert("Falha ao decodificar a ROM no navegador.");
                    loadingOverlay.style.display = 'none';
                    powerScreen.style.display = 'flex';
                }
            }, { once: true });
        } else {
            document.querySelector('.cart-status').innerText = "Cartucho Inválido";
            document.querySelector('.cart-status').style.color = "#ff0000";
            powerBtn.style.display = "none";
        }

        // Sincroniza o botão de save da horizontal com o principal
        document.addEventListener('DOMContentLoaded', () => {
            const saveBtnLandscape = document.getElementById('btn-export-save-landscape');
            if (saveBtnLandscape) {
                saveBtnLandscape.addEventListener('click', () => {
                    const originalSaveBtn = document.getElementById('btn-export-save');
                    if (originalSaveBtn) originalSaveBtn.click();
                });
            }
        });
    </script>
</body>
</html>
